    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var customFetch = rawFetch ? function() {
            return rawFetch.apply(window, arguments);
          } : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var protoFetch = proto.fetch;
              var customProtoFetch = protoFetch ? function() {
                return protoFetch.apply(window, arguments);
              } : null;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return customFetch || customProtoFetch;
                },
                set: function(fn) {
                  customFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
