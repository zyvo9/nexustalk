name: Build Flutter Apps

on:
  push:
    branches: [main]
    paths: ['flutter_app/**']
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusTalk-Android
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable windows desktop
        working-directory: flutter_app
        run: flutter config --enable-windows-desktop
      - name: Pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: Build Windows app
        working-directory: flutter_app
        run: flutter build windows --release
      - name: Bundle
        working-directory: flutter_app/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath ../../../../NexusTalk-Windows.zip
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: NexusTalk-Windows
          path: flutter_app/NexusTalk-Windows.zip
