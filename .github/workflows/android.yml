name: Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Set APP_URL in repo Settings → Secrets and variables → Actions → Variables
      CAP_SERVER_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install web deps
        working-directory: nexustalk
        run: npm install

      - name: Add Capacitor packages
        working-directory: nexustalk
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build web app
        working-directory: nexustalk
        run: npm run build

      - name: Scaffold Android project
        working-directory: nexustalk
        run: npx cap add android

      - name: Sync web assets
        working-directory: nexustalk
        run: npx cap sync android

      - name: Build debug APK
        working-directory: nexustalk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusTalk-Android-APK
          path: nexustalk/android/app/build/outputs/apk/debug/app-debug.apk
