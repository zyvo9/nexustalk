name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build the web UI and bundle it INTO the app (its own interface)
      - name: Build bundled web UI
        working-directory: nexustalk
        run: |
          npm install
          npx vite build --base=./
        env:
          # Optional pre-filled server address (repo variable APP_URL)
          VITE_DEFAULT_SERVER: ${{ vars.APP_URL }}

      - name: Copy UI into desktop app
        run: |
          rm -rf desktop/app-ui
          cp -r nexustalk/dist desktop/app-ui

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --win
        env:
          # Skip code signing (no certificate — free build)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusTalk-Windows-Setup
          path: desktop/dist/*.exe
