name: nexustalk
description: NexusTalk — private chats, HD calls and CRD-style remote desktop.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # State
  provider: ^6.1.2
  # Backend
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  # WebRTC calls + remote control
  flutter_webrtc: ^0.11.7
  # Local storage
  shared_preferences: ^2.3.3
  # Media picking (avatars, attachments)
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
